<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANK LOAN FORM</title>
    <link rel="stylesheet" href="bankloanform.css">
</head>
<h1>BANK LOAN FORM</h1>
<body>
    <Form>
        
    <label for=" Full Name">Full Name</label><br>
    <input type="text" id="Full Name" placeholder="enter capital letters">

    
    <label for="dob">date of bith</label>
    <input type="date" id="dob"name="date of birth"><br><br>

    <label for="phone number">phone number</label>

    <input type="tel" id="mobile" name="phone number" maxlength="10 requried">
    <label for="email address">email address</label>
    <input type="email" id="email">
    
    <div class="Address">
    <label for="Residential Address">Residential Address</label>
   <textarea id="text" rows="2" cols="80"></textarea>
    </div><br>
    <h4>loantype</h4>
    
    
    <input type="radio" id="personal">
    <label for="personal">personal</label>
    <input type="radio" id="mortgage">
    <label for="mortagage">mortagage</label>
    <input type="radio" id="auto">
    <label for="auto">auto</label>
    <input  type="radio" id="business">
    <label for="business">business</label>
    <br>
    <br>
    <label loan amount requested>loan amount requested</label>
    <input type="text" id="loan amount requested" value="number">
    <label loan purpose>loan purpose</label>
    <input type="text" id="loan purpose"><br><br>
    <label employer name>employer name</label>
    <textarea id="text" rows="2" cols="80"></textarea><br><br>
    <label job title>job title</label>
    <input type="text" id="job title">
    <label monthly income>monthly income</label>
<input type="text" id="monthly income">

<p>I here by confirm that the provided information is acuurate and respectfully request the bank<br>
     to proceed with the proceessing of my loan applicatin.</p>

     <label signature>signature</label>
     <textarea id="message" row="5" cols="40"></textarea>
     <label>date</label>
     <input type="date" id="date">

    </Form> 
</body>
</html>
