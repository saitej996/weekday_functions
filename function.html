<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Student Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .student-name {
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .percentage {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .progress-container {
            background: #ddd;
            height: 10px;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #2563eb;
            width: 0%;
        }

        .classes {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .classes h2 {
            margin-bottom: 20px;
        }

        .class-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 10px;
            border-bottom: 1px solid #eee;
        }

        .class-info h3 {
            margin-bottom: 5px;
        }

        .class-info p {
            color: #777;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .watched {
            background: #16a34a;
            cursor: default;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .class-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Student LMS Portal</h1>
    <div class="student-name">Welcome, Student</div>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="dashboard">

        <div class="card">
            <h3>Total Classes</h3>
            <div class="percentage" id="totalClasses">10</div>
        </div>

        <div class="card">
            <h3>Classes Watched</h3>
            <div class="percentage">
                <span id="watchedClasses">0</span>/10
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="classProgress"></div>
            </div>
        </div>

        <div class="card">
            <h3>Overall Progress</h3>
            <div class="percentage" id="overallProgress">0%</div>

            <div class="progress-container">
                <div class="progress-bar" id="overallBar"></div>
            </div>
        </div>

    </div>

    <!-- Classes -->
    <div class="classes">
        <h2>📚 My Classes</h2>

        <div id="classList"></div>
    </div>

</div>

<script>

    const classes = [
        {
            id: 1,
            title: "Introduction to JavaScript",
            problems: 80
        },
        {
            id: 2,
            title: "Variables and Data Types",
            problems: 70
        },
        {
            id: 3,
            title: "Operators",
            problems: 90
        },
        {
            id: 4,
            title: "Conditional Statements",
            problems: 60
        },
        {
            id: 5,
            title: "Loops in JavaScript",
            problems: 75
        },
        {
            id: 6,
            title: "Functions",
            problems: 85
        },
        {
            id: 7,
            title: "Arrays",
            problems: 65
        },
        {
            id: 8,
            title: "Objects",
            problems: 80
        },
        {
            id: 9,
            title: "DOM Manipulation",
            problems: 55
        },
        {
            id: 10,
            title: "Final JavaScript Project",
            problems: 0
        }
    ];

    let watched = JSON.parse(localStorage.getItem("watchedClasses")) || [];

    function displayClasses() {

        const classList = document.getElementById("classList");

        classList.innerHTML = "";

        classes.forEach(classItem => {

            const isWatched = watched.includes(classItem.id);

            const div = document.createElement("div");

            div.className = "class-item";

            div.innerHTML = `
                <div class="class-info">
                    <h3>Class ${classItem.id}: ${classItem.title}</h3>
                    <p>Problem Solving: ${classItem.problems}%</p>
                </div>

                <button
                    class="${isWatched ? 'watched' : ''}"
                    onclick="markWatched(${classItem.id})"
                    ${isWatched ? 'disabled' : ''}>
                    ${isWatched ? '✓ Watched' : 'Watch Class'}
                </button>
            `;

            classList.appendChild(div);
        });

        updateDashboard();
    }


    function markWatched(id) {

        if (!watched.includes(id)) {

            watched.push(id);

            localStorage.setItem(
                "watchedClasses",
                JSON.stringify(watched)
            );

            displayClasses();
        }
    }


    function updateDashboard() {

        const total = classes.length;

        const watchedCount = watched.length;

        const classPercentage =
            Math.round((watchedCount / total) * 100);

        // Average problem-solving percentage
        const problemPercentage =
            Math.round(
                classes.reduce(
                    (sum, item) => sum + item.problems,
                    0
                ) / total
            );

        // Overall progress
        const overall =
            Math.round(
                (classPercentage + problemPercentage) / 2
            );

        document.getElementById("totalClasses")
            .textContent = total;

        document.getElementById("watchedClasses")
            .textContent = watchedCount;

        document.getElementById("classProgress")
            .style.width = classPercentage + "%";

        document.getElementById("overallProgress")
            .textContent = overall + "%";

        document.getElementById("overallBar")
            .style.width = overall + "%";
    }


    displayClasses();

</script>

</body>
</html>
